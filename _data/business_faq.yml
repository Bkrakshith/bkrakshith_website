# Questions on the For business page (humanoids-for-business.html).
# Also feeds that page's FAQPage structured data.
- q: "Is there any cost or commitment to talk?"
  a: "No. The first conversation is free and there is no obligation. It is a chance to see whether a robot fits your work."
- q: "Which tasks suit a humanoid today?"
  a: "Tasks that repeat, have a clear end and happen in spaces built for people: picking, packing, restocking, and moving boxes and totes."
- q: "Humanoid, quadruped or AMR?"
  a: "It depends on the task. AMRs move goods between stations, quadrupeds cover rough ground and stairs for inspection, and humanoids handle objects where people work today."
- q: "Can robots work round the clock?"
  a: "Robots can work across shifts, including nights, with planned charging and maintenance. The task decides how many productive hours that adds."
- q: "Why be an early adopter?"
  a: "A head start. Early adopters put humanoids to work on a real task first, and learn where robots help the business grow."
