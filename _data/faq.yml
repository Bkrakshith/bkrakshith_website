# Homepage questions: what got Rakshith into robotics and what keeps it
# interesting. Also feeds the FAQPage structured data on the homepage.
# Third person, short sentences.
- q: "What got Rakshith into robotics?"
  a: "Building things at university. Rakshith founded the robotics club and the drone society at Nottingham Trent University, and worked on an aircraft cabin lab, a surgery trainer and a mobile manipulator before moving to humanoid robots."
- q: "What keeps Rakshith motivated?"
  a: "Seeing a robot do useful work outside a demo. Most of what Rakshith knows came from real hardware: running demos, teleoperating robots and testing new methods on humanoids."
- q: "Why humanoid robots?"
  a: "Most workplaces are built for people. A humanoid can use the same aisles, shelves and tools, so it can do productive work with fewer changes to the site."
- q: "Why both hardware and software?"
  a: "Most robotics problems sit between the two. A controller that works in simulation can fail on a real actuator, so Rakshith tests on the hardware early."
- q: "What is Unfiltered Robotics?"
  a: "Rakshith's podcast about legged robots, hobby builds and hardware development, with the people who build them."
- q: "Where is Rakshith based?"
  a: "In the United Kingdom and Singapore. Always happy to meet people in robotics, in person or online."
