{%- assign p = include.p -%}
<a class="pcard{% unless p.image %} pcard-text tone-{{ p.tone | default: 'dark' }}{% endunless %}" href="{{ p.url | relative_url }}">
  {%- if p.image %}
  <img src="{{ p.image | relative_url }}" alt="" width="1600" height="900" loading="lazy">
  {%- else %}
  <span class="mark" aria-hidden="true">{{ p.mark }}</span>
  {%- endif %}
  <span class="go" aria-hidden="true">{% include icon.html name="arrow" %}</span>
  <div class="pcard-body">
    <span class="tag">{{ p.tag }}</span>
    <h3>{{ p.title }}</h3>
    <p>{{ p.line }}</p>
  </div>
</a>
