# Jekyll config — GitHub Pages builds the Articles section from this.
# The rest of the site (index.html, *.dc.html, support.js …) has no front
# matter, so Jekyll copies it through untouched.

title: Rakshith Bangalore
description: >-
  Rakshith Bangalore is a robotics solutions architect and hands-on robotics
  generalist in the United Kingdom and Singapore, helping startups and
  businesses start robotics programmes, across robot hardware and software.
url: https://bkrakshith.com
baseurl: ""
lang: en-GB
timezone: Europe/London
author: Rakshith Bangalore
default_image: /assets/og-default.jpg

# Curated LinkedIn posts for the homepage "Latest" section (data only).
collections:
  linkedin:
    output: false

# Articles live in _posts/ and are served at /articles/<slug>/ (set in
# defaults below, so the other pages keep their .html addresses).

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-feed

# RSS feed (for Medium import, email newsletters, LinkedIn schedulers)
feed:
  path: articles/feed.xml

exclude:
  - README.md
  - LICENSE

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
      permalink: /articles/:title/
